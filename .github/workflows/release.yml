name: release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v5.4.1. Created on the selected branch if it does not already exist.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build_release:
    runs-on: windows-latest
    env:
      # A tag push supplies the tag via github.ref_name (e.g. v5.4.1). A manual run from the Actions tab
      # has github.ref set to the branch (refs/heads/master), which is not a valid tag, so use the input.
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
    - name: Publish
      run: dotnet publish -c Release
    - name: Release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      # Creates the tag on the built commit if it doesn't exist (manual runs), then the release with the exe attached.
      run: >
        gh release create "$RELEASE_TAG"
        FixClient/bin/Release/net10.0-windows/win-x64/publish/FixClient.exe
        --target "$GITHUB_SHA"
        --title "$RELEASE_TAG"
        --notes-file CHANGELOG.md
    - name: Publish Fix.Common
      uses: tedd/publish-nuget-neo@v1
      with:
          PROJECT_FILE_PATH: Fix.Common/Fix.Common.csproj
          NUGET_KEY: ${{ secrets.NUGET_KEY }}
          TAG_COMMIT: false
          VERSION_FILE_PATH: Directory.Build.props    
    - name: Publish Fix.Dictionary
      uses: tedd/publish-nuget-neo@v1
      with:
          PROJECT_FILE_PATH: Fix.Dictionary/Fix.Dictionary.csproj
          NUGET_KEY: ${{ secrets.NUGET_KEY }}
          TAG_COMMIT: false
          VERSION_FILE_PATH: Directory.Build.props
    - name: Publish Fix
      uses: tedd/publish-nuget-neo@v1
      with:
          PROJECT_FILE_PATH: Fix/Fix.csproj
          NUGET_KEY: ${{ secrets.NUGET_KEY }}
          TAG_COMMIT: false
          VERSION_FILE_PATH: Directory.Build.props